name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff

      - name: Lint with ruff
        run: ruff check ahy_governance/ --output-format=github

      - name: Format check with ruff
        run: ruff format --check ahy_governance/

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bandit
        run: pip install bandit

      - name: Security scan with bandit
        run: bandit -r ahy_governance/ -ll --skip B101

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
        extras: ['web', 'web,security']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[${{ matrix.extras }}]"
          pip install pytest pytest-cov pytest-anyio

      - name: Run tests with coverage
        run: pytest tests/ -v --tb=short --cov=ahy_governance --cov-report=term-missing --cov-fail-under=80
