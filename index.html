<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src *; img-src 'self' data:;">
<title>Ahy Governance Dashboard</title>
<style>
:root {
  --bg-primary: #0a0e14;
  --bg-secondary: #141b22;
  --bg-card: #1a2332;
  --bg-elevated: #212d3d;
  --text-primary: #e6edf3;
  --text-secondary: #8b949e;
  --text-muted: #484f58;
  --accent: #58a6ff;
  --accent-green: #3fb950;
  --accent-yellow: #d29922;
  --accent-red: #f85149;
  --accent-purple: #a371f7;
  --border: #30363d;
  --font-mono: 'Cascadia Code', 'JetBrains Mono', 'Fira Code', monospace;
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --radius: 6px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  background: var(--bg-primary);
  color: var(--text-primary);
  display: flex;
  height: 100vh;
  overflow: hidden;
  font-size: 13px;
  line-height: 1.5;
}

/* Sidebar */
.sidebar {
  width: 220px;
  min-width: 220px;
  background: var(--bg-secondary);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 16px 0;
}
.sidebar-logo {
  padding: 0 16px 16px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 8px;
}
.sidebar-logo h1 {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: var(--accent);
}
.sidebar-logo span {
  font-size: 10px;
  color: var(--text-muted);
  display: block;
  margin-top: 2px;
}
.sidebar-nav { flex: 1; }
.sidebar-nav button {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 8px 16px;
  border: none;
  background: none;
  color: var(--text-secondary);
  font-size: 13px;
  cursor: pointer;
  text-align: left;
  transition: background 0.15s;
}
.sidebar-nav button:hover { background: var(--bg-elevated); color: var(--text-primary); }
.sidebar-nav button.active {
  background: var(--bg-elevated);
  color: var(--accent);
  border-right: 2px solid var(--accent);
}
.sidebar-nav button .icon { width: 18px; text-align: center; font-size: 14px; }
.sidebar-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--text-muted);
}
.sidebar-footer .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 6px; }
.sidebar-footer .dot.online { background: var(--accent-green); }

/* Main */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 20px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-secondary);
}
.topbar h2 { font-size: 15px; font-weight: 600; }
.topbar-actions { display: flex; align-items: center; gap: 10px; }
.topbar-actions select, .topbar-actions button {
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text-primary);
  padding: 4px 10px;
  border-radius: var(--radius);
  font-size: 12px;
  cursor: pointer;
}
.topbar-actions button:hover { background: var(--bg-elevated); }
.content { flex: 1; overflow-y: auto; padding: 20px; }

/* Cards */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 18px; }
.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
}
.stat-card .label { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
.stat-card .value { font-size: 28px; font-weight: 700; margin: 4px 0; font-family: var(--font-mono); }
.stat-card .sub { font-size: 11px; color: var(--text-muted); }
.value.green { color: var(--accent-green); }
.value.red { color: var(--accent-red); }
.value.yellow { color: var(--accent-yellow); }
.value.accent { color: var(--accent); }

/* Tables */
.table-wrap { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.table-wrap .table-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px; border-bottom: 1px solid var(--border);
  font-size: 12px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px;
}
table { width: 100%; border-collapse: collapse; }
th, td { padding: 8px 14px; text-align: left; font-size: 12px; }
th { color: var(--text-secondary); font-weight: 600; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { border-bottom: 1px solid var(--border); color: var(--text-primary); }
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--bg-elevated); }

/* Badges */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600;
}
.badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; }
.badge.healthy { color: var(--accent-green); background: rgba(63,185,80,0.1); }
.badge.healthy::before { background: var(--accent-green); }
.badge.degraded { color: var(--accent-yellow); background: rgba(210,153,34,0.1); }
.badge.degraded::before { background: var(--accent-yellow); }
.badge.unhealthy { color: var(--accent-red); background: rgba(248,81,73,0.1); }
.badge.unhealthy::before { background: var(--accent-red); }
.badge.offline { color: var(--text-muted); background: rgba(72,79,88,0.1); }
.badge.offline::before { background: var(--text-muted); }
.badge.critical { color: var(--accent-red); background: rgba(248,81,73,0.15); font-weight: 700; }
.badge.high { color: var(--accent-yellow); background: rgba(210,153,34,0.1); }
.badge.medium { color: var(--accent); background: rgba(88,166,255,0.1); }
.badge.low { color: var(--text-muted); background: rgba(72,79,88,0.1); }

/* Progress bar */
.progress-bar {
  height: 6px; background: var(--bg-elevated); border-radius: 3px; overflow: hidden; min-width: 60px;
}
.progress-bar .fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
.fill.green { background: var(--accent-green); }
.fill.yellow { background: var(--accent-yellow); }
.fill.red { background: var(--accent-red); }

/* Gauge */
.gauge {
  display: flex; align-items: center; gap: 16px; padding: 16px;
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
  margin-bottom: 14px;
}
.gauge-bar {
  flex: 1; height: 20px; background: var(--bg-elevated); border-radius: 10px; overflow: hidden; position: relative;
}
.gauge-fill {
  height: 100%; border-radius: 10px; transition: width 0.5s, background 0.5s;
}
.gauge-text { font-family: var(--font-mono); font-size: 18px; font-weight: 700; white-space: nowrap; }

/* Section */
.section { margin-bottom: 18px; }
.section-title {
  font-size: 12px; color: var(--text-secondary); text-transform: uppercase;
  letter-spacing: 0.5px; margin-bottom: 8px; font-weight: 600;
}

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 14px; border-radius: var(--radius); font-size: 12px; font-weight: 600;
  border: 1px solid var(--border); cursor: pointer; transition: background 0.15s;
}
.btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn-primary:hover { opacity: 0.85; }
.btn-default { background: var(--bg-card); color: var(--text-primary); }
.btn-default:hover { background: var(--bg-elevated); }
.btn-danger { background: var(--accent-red); color: #fff; border-color: var(--accent-red); }

/* Textarea / Input */
input, textarea, select {
  background: var(--bg-elevated); border: 1px solid var(--border);
  color: var(--text-primary); padding: 8px 10px; border-radius: var(--radius);
  font-size: 12px; font-family: var(--font-sans); width: 100%;
}
textarea { font-family: var(--font-mono); resize: vertical; min-height: 120px; }
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }

/* Two-column */
.cols-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

/* Modal overlay */
.modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
  z-index: 100; align-items: center; justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 20px; max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto;
}
.modal h3 { margin-bottom: 12px; }
.modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }

/* Expando */
.expando { display: none; padding: 12px 14px; background: var(--bg-elevated); border-bottom: 1px solid var(--border); }
.expando.show { display: block; }
tr.clickable { cursor: pointer; }

/* Error banner */
.error-banner {
  display: none; padding: 8px 14px; background: rgba(248,81,73,0.12);
  border: 1px solid var(--accent-red); border-radius: var(--radius);
  color: var(--accent-red); font-size: 12px; margin-bottom: 14px;
}
.error-banner.show { display: block; }

/* Loading spinner */
.spinner {
  width: 24px; height: 24px; border: 2px solid var(--border); border-top-color: var(--accent);
  border-radius: 50%; animation: spin 0.6s linear infinite; margin: 40px auto;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Tags */
.tags { display: flex; gap: 4px; flex-wrap: wrap; }
.tag {
  font-size: 10px; padding: 1px 6px; border-radius: 8px;
  background: rgba(88,166,255,0.1); color: var(--accent);
}

/* Copy text */
.copy-text {
  font-family: var(--font-mono); font-size: 12px; padding: 8px 10px;
  background: var(--bg-elevated); border: 1px solid var(--border);
  border-radius: var(--radius); word-break: break-all;
}

/* Panel visibility */
.panel { display: none; }
.panel.active { display: block; }

/* Integrity banner */
.integrity-banner {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 14px; border-radius: var(--radius); font-size: 13px; font-weight: 600; margin-bottom: 14px;
}
.integrity-banner.verified { background: rgba(63,185,80,0.1); border: 1px solid var(--accent-green); color: var(--accent-green); }
.integrity-banner.tampered { background: rgba(248,81,73,0.1); border: 1px solid var(--accent-red); color: var(--accent-red); }

/* Responsive */
@media (max-width: 768px) {
  .sidebar { width: 56px; min-width: 56px; }
  .sidebar-logo h1, .sidebar-logo span, .sidebar-nav button span:not(.icon), .sidebar-footer { display: none; }
  .sidebar-nav button { justify-content: center; padding: 10px; }
  .cols-2 { grid-template-columns: 1fr; }
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-logo">
    <h1>AHY GOVERNANCE</h1>
    <span>v0.7.0</span>
  </div>
  <nav class="sidebar-nav">
    <button data-view="dashboard" class="active"><span class="icon">◉</span> Dashboard</button>
    <button data-view="health"><span class="icon">♥</span> Health</button>
    <button data-view="cost"><span class="icon">$</span> Cost</button>
    <button data-view="conflicts"><span class="icon">⚠</span> Conflicts</button>
    <button data-view="audit"><span class="icon">☰</span> Audit</button>
    <button data-view="memory"><span class="icon">◈</span> Memory</button>
    <button data-view="security"><span class="icon">⛨</span> Security</button>
  </nav>
  <div class="sidebar-footer"><span class="dot online"></span> API Connected</div>
</aside>

<main class="main">
  <div class="topbar">
    <h2 id="panel-title">Dashboard</h2>
    <div class="topbar-actions">
      <select id="poll-interval" title="Refresh interval">
        <option value="5000">5s</option>
        <option value="15000">15s</option>
        <option value="30000">30s</option>
        <option value="0">Paused</option>
      </select>
      <button id="btn-refresh" class="btn btn-default">↻ Refresh</button>
      <button id="btn-demo" class="btn btn-primary">⚡ Demo Data</button>
    </div>
  </div>
  <div id="error-banner" class="error-banner"></div>
  <div class="content" id="content"></div>
</main>

<script>
(function() {
const API = new URLSearchParams(location.search).get('api') || '/api';
function escapeHtml(str) {
  const s = String(str ?? '');
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
const state = {
  view: 'dashboard',
  health: null,
  cost: null,
  audit: null,
  memory: null,
  rbac: null,
  conflictTypes: [],
  polling: null,
  pollMs: 5000,
};

const titles = {
  dashboard: 'Dashboard',
  health: 'Agent Health',
  cost: 'Cost Tracker',
  conflicts: 'Conflict Detector',
  audit: 'Audit Logger',
  memory: 'Memory Sharing',
  security: 'Security',
};

// ── Helpers ──────────────────────────────────────────────

async function fetchJSON(url, opts) {
  const res = await fetch(url, opts);
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error || res.statusText);
  }
  return res.json();
}

function $(sel) { return document.querySelector(sel); }
function $$(sel) { return document.querySelectorAll(sel); }
function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  if (attrs) Object.entries(attrs).forEach(([k,v]) => { if (v != null) e[k] = v; });
  children.forEach(c => { if (c != null) e.append(typeof c === 'string' ? document.createTextNode(c) : c); });
  return e;
}

function showError(msg) {
  const b = $('#error-banner');
  b.textContent = msg;
  b.classList.add('show');
  setTimeout(() => b.classList.remove('show'), 5000);
}

function fmtUSD(n) { return '$' + n.toFixed(2); }
function fmtPct(n) { return (n * 100).toFixed(1) + '%'; }
function fmtMs(n) { return n.toFixed(0) + 'ms'; }
function fmtNum(n) { return n.toLocaleString(); }
function fmtTime(ts) {
  if (!ts) return '-';
  return new Date(ts).toLocaleString();
}
function fmtDur(ms) {
  if (ms < 1000) return ms.toFixed(0) + 'ms';
  return (ms / 1000).toFixed(1) + 's';
}

function badge(text, cls) {
  return `<span class="badge ${cls}">${text}</span>`;
}

// ── Navigation ──────────────────────────────────────────

function switchView(view) {
  state.view = view;
  $$('.sidebar-nav button').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  $('#panel-title').textContent = titles[view] || view;
  render();
}

$$('.sidebar-nav button').forEach(b => {
  b.addEventListener('click', () => switchView(b.dataset.view));
});

// ── Render Router ───────────────────────────────────────

function render() {
  const v = state.view;
  if (v === 'dashboard') renderDashboard();
  else if (v === 'health') renderHealth();
  else if (v === 'cost') renderCost();
  else if (v === 'conflicts') renderConflicts();
  else if (v === 'audit') renderAudit();
  else if (v === 'memory') renderMemory();
  else if (v === 'security') renderSecurity();
}

// ── Dashboard ───────────────────────────────────────────

function renderDashboard() {
  const c = $('#content');
  if (!state.health || !state.cost || !state.audit) {
    c.innerHTML = '<div class="spinner"></div>';
    return;
  }
  const h = state.health;
  const ct = state.cost;
  const au = state.audit;

  let healthy = 0, degraded = 0, unhealthy = 0;
  Object.values(h.agents || {}).forEach(a => {
    if (a.status === 'healthy') healthy++;
    else if (a.status === 'degraded') degraded++;
    else if (a.status === 'unhealthy') unhealthy++;
    else if (a.status === 'offline') unhealthy++;
  });

  c.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card">
        <div class="label">Agents Healthy</div>
        <div class="value green">${healthy}/${Object.keys(h.agents || {}).length}</div>
        <div class="sub">${degraded} degraded, ${unhealthy} unhealthy</div>
      </div>
      <div class="stat-card">
        <div class="label">Total Cost</div>
        <div class="value accent">${fmtUSD(ct.total_cost_usd || 0)}</div>
        <div class="sub">${fmtNum(ct.total_entries || 0)} entries</div>
      </div>
      <div class="stat-card">
        <div class="label">Audit Integrity</div>
        <div class="value green">Verified</div>
        <div class="sub">${fmtNum(au.entry_count || 0)} entries</div>
      </div>
      <div class="stat-card">
        <div class="label">Budget</div>
        ${ct.budget ? `
          <div class="value ${ct.budget.usage_pct > 80 ? 'red' : ct.budget.usage_pct > 60 ? 'yellow' : 'green'}">${ct.budget.usage_pct.toFixed(0)}%</div>
          <div class="sub">${fmtUSD(ct.budget.current_usd)} / ${fmtUSD(ct.budget.limit_usd)}</div>
        ` : `
          <div class="value accent">-</div>
          <div class="sub">No budget set</div>
        `}
      </div>
    </div>

    <div class="section">
      <div class="section-title">Agent Health</div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Agent</th><th>Status</th><th>Success Rate</th><th>Calls</th><th>P95</th></tr></thead>
          <tbody>
            ${Object.entries(h.agents || {}).slice(0, 10).map(([name, a]) => `
              <tr>
                <td>${escapeHtml(name)}</td>
                <td>${badge(a.status, a.status)}</td>
                <td>
                  <div style="display:flex;align-items:center;gap:8px;">
                    <div class="progress-bar"><div class="fill ${a.success_rate > 0.95 ? 'green' : a.success_rate > 0.8 ? 'yellow' : 'red'}" style="width:${a.success_rate * 100}%"></div></div>
                    ${fmtPct(a.success_rate)}
                  </div>
                </td>
                <td>${fmtNum(a.total_calls)}</td>
                <td>${fmtMs(a.latency_p95)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>

    <div class="cols-2">
      <div class="section">
        <div class="section-title">Cost by Agent</div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Agent</th><th>Cost</th><th>Tokens</th></tr></thead>
            <tbody>
              ${Object.entries(ct.by_agent || {}).slice(0, 5).map(([name, c]) => `
                <tr><td>${name}</td><td>${fmtUSD(c.cost_usd)}</td><td>${fmtNum(c.tokens_total)}</td></tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>
      <div class="section">
        <div class="section-title">Recent Audit Events</div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Type</th><th>Agent</th><th>Time</th></tr></thead>
            <tbody>
              ${(state.auditRaw || []).slice(0, 6).map(e => `
                <tr><td>${badge(e.event_type, 'medium')}</td><td>${e.agent}</td><td>${fmtTime(e.timestamp)}</td></tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  `;
}

// ── Health Panel ────────────────────────────────────────

function renderHealth() {
  const c = $('#content');
  if (!state.health) { c.innerHTML = '<div class="spinner"></div>'; return; }
  const h = state.health;

  c.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="label">Total Agents</div><div class="value accent">${h.summary?.total_agents || 0}</div></div>
      <div class="stat-card"><div class="label">Healthy</div><div class="value green">${h.summary?.healthy_count || 0}</div></div>
      <div class="stat-card"><div class="label">Degraded</div><div class="value yellow">${h.summary?.degraded_count || 0}</div></div>
      <div class="stat-card"><div class="label">Unhealthy/Offline</div><div class="value red">${h.summary?.unhealthy_count || 0}</div></div>
    </div>
    <div class="table-wrap">
      <div class="table-header">Agent Details</div>
      <table>
        <thead><tr><th>Agent</th><th>Status</th><th>Success Rate</th><th>Error Rate</th><th>Calls</th><th>P50</th><th>P95</th><th>P99</th><th>Last Heartbeat</th></tr></thead>
        <tbody>
          ${Object.entries(h.agents || {}).map(([name, a]) => `
            <tr>
              <td><strong>${escapeHtml(name)}</strong></td>
              <td>${badge(a.status, a.status)}</td>
              <td><div style="display:flex;align-items:center;gap:6px;"><div class="progress-bar"><div class="fill ${a.success_rate > 0.95 ? 'green' : 'yellow'}" style="width:${a.success_rate * 100}%"></div></div>${fmtPct(a.success_rate)}</div></td>
              <td>${fmtPct(a.error_rate)}</td>
              <td>${fmtNum(a.total_calls)}</td>
              <td>${fmtMs(a.latency_p50)}</td>
              <td>${fmtMs(a.latency_p95)}</td>
              <td>${fmtMs(a.latency_p99)}</td>
              <td>${fmtTime(a.last_heartbeat)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}

// ── Cost Panel ──────────────────────────────────────────

function renderCost() {
  const c = $('#content');
  if (!state.cost) { c.innerHTML = '<div class="spinner"></div>'; return; }
  const ct = state.cost;

  const budgetPct = ct.budget ? ct.budget.usage_pct : 0;
  const gaugeColor = budgetPct > 85 ? 'var(--accent-red)' : budgetPct > 60 ? 'var(--accent-yellow)' : 'var(--accent-green)';

  c.innerHTML = `
    ${ct.budget ? `
    <div class="gauge">
      <div style="font-size:12px;color:var(--text-secondary);">Budget</div>
      <div class="gauge-bar">

function renderConflicts() {

    <div class="cols-2">
      <div>
        <div class="section-title">Step Outputs (JSON)</div>
        <textarea id="co-inputs" placeholder='{"AgentName": {"output": "...", "confidence": 0.9}, ...}'></textarea>
        <div class="section-title" style="margin-top:10px;">DAG Definition (JSON, optional)</div>
        <textarea id="co-dag" placeholder='{"steps": ["A","B"], "edges": [{"from":"A","to":"B"}]}'></textarea>
        <div style="margin-top:10px;display:flex;gap:8px;">
          <button class="btn btn-primary" id="btn-check-conflicts">Check Conflicts</button>
          <button class="btn btn-default" id="btn-load-example">Load Example</button>
        </div>
        <div id="co-error" style="color:var(--accent-red);font-size:12px;margin-top:8px;"></div>
      </div>
      <div>
        <div class="section-title">Results</div>
        <div id="co-results" style="color:var(--text-muted);padding:20px;text-align:center;">

        </div>
      </div>
    </div>
  `;

  $('#btn-check-conflicts').onclick = async () => {
    const errEl = $('#co-error');
    errEl.textContent = '';

      const inputs = JSON.parse($('#co-inputs').value || '{}');
      const dagText = $('#co-dag').value.trim();
      const body = { step_outputs: inputs };
      if (dagText) body.dag = JSON.parse(dagText);
      const conflicts = await fetchJSON(API + '/conflicts/check', {
        method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)
      });
      if (conflicts.length === 0) {
        $('#co-results').innerHTML = '<div style="text-align:center;padding:40px;color:var(--accent-green);">No conflicts detected</div>';
      } else {
        $('#co-results').innerHTML = `
          <div class="table-wrap">
            <table>
              <thead><tr><th>Type</th><th>Severity</th><th>Agents</th><th>Description</th><th>Suggestion</th></tr></thead>
              <tbody>
                ${conflicts.map(c => `
                  <tr>
                    <td>${c.conflict_type}</td>
                    <td>${badge(c.severity, c.severity.toLowerCase())}</td>
                    <td>${(c.agents || []).join(', ')}</td>
                    <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;">${c.description || ''}</td>
                    <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;">${c.suggestion || ''}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      }
    } catch (e) {
      errEl.textContent = 'Error: ' + e.message;
    }
  };

  $('#btn-load-example').onclick = async () => {
    try {
      const demo = await fetchJSON(API + '/conflicts/demo');
      $('#co-inputs').value = JSON.stringify(demo.sample_inputs, null, 2);
      $('#co-dag').value = JSON.stringify(demo.sample_dag, null, 2);
    } catch (e) { showError(e.message); }
  };
}

// ── Audit Panel ─────────────────────────────────────────

function renderAudit() {
  const c = $('#content');
  if (!state.audit) { c.innerHTML = '<div class="spinner"></div>'; return; }

  const verified = state.auditVerified !== false;
  const events = state.auditRaw || [];

  c.innerHTML = `
    <div class="integrity-banner ${verified ? 'verified' : 'tampered'}">
      ${verified ? '✓ Chain Verified' : '✗ Tampering Detected'} &mdash;
      ${fmtNum(state.audit.entry_count || 0)} entries, root hash: <code style="font-size:11px;">${state.audit.root_hash || '-'}</code>
    </div>

    <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;">
      <input id="audit-search" placeholder="Search agents/details..." style="max-width:250px;">
      <select id="audit-filter-type" style="max-width:200px;">
        <option value="">All Event Types</option>
      </select>
      <button class="btn btn-default" id="btn-export-soc2">Export SOC2</button>
      <button class="btn btn-default" id="btn-export-iso">Export ISO27001</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead><tr><th>#</th><th>Time</th><th>Event</th><th>Agent</th><th>Session</th><th>Details</th></tr></thead>
        <tbody id="audit-tbody">
          ${events.map((e, i) => `
            <tr class="clickable" data-idx="${i}">
              <td>${e.index}</td>
              <td>${fmtTime(e.timestamp)}</td>
              <td>${badge(e.event_type, 'medium')}</td>
              <td>${escapeHtml(e.agent)}</td>
              <td>${escapeHtml(e.session_id || '-')}</td>
              <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${JSON.stringify(e.details)}</td>
            </tr>
            <tr class="expando-row" data-idx="${i}"><td colspan="6"><div class="expando">
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;">
                <div><span style="color:var(--text-muted);">Hash:</span> <code>${e.hash || '-'}</code></div>
                <div><span style="color:var(--text-muted);">Prev:</span> <code>${e.prev_hash || '-'}</code></div>
              </div>
              <div style="margin-top:8px;"><span style="color:var(--text-muted);">Details:</span> <pre style="margin-top:4px;font-size:11px;color:var(--text-secondary);">${JSON.stringify(e.details, null, 2)}</pre></div>
            </div></td></tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;

  // Populate event type filter
  const filter = $('#audit-filter-type');
  const seen = new Set(events.map(e => e.event_type));
  seen.forEach(t => { const o = el('option', {value:t}, t); filter.appendChild(o); });

  // Row click to expand
  $$('#audit-tbody tr.clickable').forEach(row => {
    row.onclick = () => {
      const idx = row.dataset.idx;
      const expRow = document.querySelector(`tr.expando-row[data-idx="${idx}"] .expando`);
      if (expRow) expRow.classList.toggle('show');
    };
  });

  // Filter
  $('#audit-search').oninput = () => filterAudit();
  $('#audit-filter-type').onchange = () => filterAudit();

  function filterAudit() {
    const q = $('#audit-search').value.toLowerCase();
    const type = $('#audit-filter-type').value;
    $$('#audit-tbody tr.clickable').forEach(row => {
      const e = events[row.dataset.idx];
      let show = true;
      if (q && !e.agent.toLowerCase().includes(q) && !JSON.stringify(e.details).toLowerCase().includes(q)) show = false;
      if (type && e.event_type !== type) show = false;
      row.style.display = show ? '' : 'none';
      const expRow = document.querySelector(`tr.expando-row[data-idx="${row.dataset.idx}"]`);
      if (expRow) expRow.style.display = show ? '' : 'none';
    });
  }

  $('#btn-export-soc2').onclick = async () => {
    const data = await fetchJSON(API + '/audit/export/soc2');
    downloadJSON('soc2-report.json', data);
  };
  $('#btn-export-iso').onclick = async () => {
    const data = await fetchJSON(API + '/audit/export/iso27001');
    downloadJSON('iso27001-report.json', data);
  };
}

function downloadJSON(filename, data) {
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = el('a', {href: url, download: filename});
  a.click();
  URL.revokeObjectURL(url);
}

async function renderMemory() {
  const c = $('#content');
  try {
    const namespaces = await fetchJSON(API + '/memory/namespaces');
    const stats = await fetchJSON(API + '/memory/stats');

    c.innerHTML = `
      <div class="cols-2">
        <div>
          <div class="section-title">Namespaces</div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Namespace</th><th>Entries</th></tr></thead>
              <tbody id="mem-ns-list">
                ${namespaces.map(ns => `
                  <tr class="clickable" data-ns="${ns}" id="mem-ns-${ns}">
                    <td>${ns}</td><td>${(stats.by_namespace || {})[ns] || 0}</td>
                  </tr>
                `).join('')}
                ${namespaces.length === 0 ? '<tr><td colspan="2" style="color:var(--text-muted);text-align:center;">No namespaces</td></tr>' : ''}
              </tbody>
            </table>
          </div>
        </div>
        <div>
          <div class="section-title">Entries <span id="mem-ns-label"></span></div>
          <input id="mem-search" placeholder="Search key or value..." style="margin-bottom:8px;">
          <div id="mem-entries"><div style="color:var(--text-muted);text-align:center;padding:20px;">Select a namespace</div></div>
        </div>
      </div>
    `;

    $$('#mem-ns-list tr.clickable').forEach(row => {
      row.onclick = () => selectNamespace(row.dataset.ns);
    });

    $('#mem-search').oninput = debounce(() => {
      const ns = state.selectedNs;
      if (ns) searchNamespace(ns, $('#mem-search').value);
    }, 300);

  } catch (e) { c.innerHTML = `<div class="spinner"></div>`; }
}

async function selectNamespace(ns) {
  state.selectedNs = ns;
  $('#mem-ns-label').textContent = '— ' + ns;
  $$('#mem-ns-list tr.clickable').forEach(r => r.style.background = '');
  const row = $('#mem-ns-' + ns);
  if (row) row.style.background = 'var(--bg-elevated)';
  await searchNamespace(ns, $('#mem-search')?.value || '');
}

async function searchNamespace(ns, query) {
  const container = $('#mem-entries');
  try {
    const url = API + '/memory/' + encodeURIComponent(ns) + '/search?query=' + encodeURIComponent(query || '');
    const entries = await fetchJSON(url);
    if (entries.length === 0) {
      container.innerHTML = '<div style="color:var(--text-muted);text-align:center;padding:20px;">No entries found</div>';
      return;
    }
    container.innerHTML = `
      <div class="table-wrap">
        <table>
          <thead><tr><th>Key</th><th>Source</th><th>Tags</th><th>Access</th><th>TTL</th></tr></thead>
          <tbody>
            ${entries.map(e => `
              <tr class="clickable" data-key="${escapeHtml(e.key)}">
                <td><strong>${escapeHtml(e.key)}</strong></td>
                <td>${escapeHtml(e.source_agent || '-')}</td>
                <td><div class="tags">${(e.tags || []).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}</div></td>
                <td>${e.access_count}</td>
                <td>${e.ttl_seconds ? fmtDur(e.ttl_seconds) : '∞'}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;

    $$('#mem-entries tr.clickable').forEach(row => {
      row.onclick = () => showEntryDetail(ns, row.dataset.key);
    });
  } catch (e) { container.innerHTML = '<div style="color:var(--accent-red);">Error: ' + e.message + '</div>'; }
}

async function showEntryDetail(ns, key) {
  const entries = await fetchJSON(API + '/memory/' + encodeURIComponent(ns) + '/search?query=' + encodeURIComponent(key));
  const e = entries.find(e => e.key === key);
  if (!e) return;

  const overlay = el('div', {className: 'modal-overlay show'});
  overlay.innerHTML = `
    <div class="modal">
      <h3>${e.key}</h3>
      <div style="display:grid;gap:8px;font-size:12px;">
        <div><span style="color:var(--text-muted);">Namespace:</span> ${ns}</div>
        <div><span style="color:var(--text-muted);">Source Agent:</span> ${e.source_agent || '-'}</div>
        <div><span style="color:var(--text-muted);">Access Count:</span> ${e.access_count}</div>
        <div><span style="color:var(--text-muted);">Tags:</span> <div class="tags">${(e.tags || []).map(t => `<span class="tag">${t}</span>`).join('')}</div></div>
        <div><span style="color:var(--text-muted);">TTL:</span> ${e.ttl_seconds ? fmtDur(e.ttl_seconds) : 'No expiry'}</div>
        <div><span style="color:var(--text-muted);">Expired:</span> ${e.expired ? 'Yes' : 'No'}</div>
        <div><span style="color:var(--text-muted);">Value:</span></div>
        <div class="copy-text">${escapeHtml(e.value)}</div>
      </div>
      <div class="actions">
        <button class="btn btn-default" id="mem-modal-close">Close</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  overlay.querySelector('#mem-modal-close').onclick = () => overlay.remove();
  overlay.onclick = (ev) => { if (ev.target === overlay) overlay.remove(); };
}

function debounce(fn, ms) {
  let timer;
  return (...args) => { clearTimeout(timer); timer = setTimeout(() => fn(...args), ms); };
}

// ── Data Fetching ──────────────────────────────────────

async function refreshAll() {
  try {
    const [health, cost, audit, auditRaw] = await Promise.all([
      fetchJSON(API + '/health/dashboard'),
      fetchJSON(API + '/cost/report'),
      fetchJSON(API + '/audit/integrity'),
      fetchJSON(API + '/audit/recent?n=50'),
    ]);
    state.health = health;
    state.cost = cost;
    state.audit = { entry_count: audit.entry_count || auditRaw.length, root_hash: '' };
    state.auditVerified = audit.verified;
    state.auditRaw = auditRaw;
    state.costRaw = cost._entries || [];
    $('.sidebar-footer').innerHTML = '<span class="dot online"></span> API Connected';
    $('#error-banner').classList.remove('show');
    render();
  } catch (e) {
    $('.sidebar-footer').innerHTML = '<span class="dot" style="background:var(--accent-red);"></span> API Error';
    if (API === '/api') {
      showError('No API backend configured. Add ?api=YOUR_SERVER_URL/api to the URL.');
    } else {
      showError('Connection error — retrying...');
    }
  }
}

async function loadDemoData() {
  const demos = [
    '/health/demo', '/cost/demo', '/audit/demo', '/rbac/demo', '/memory/demo', '/guard/demo',
  ];
  try {
    await Promise.all(demos.map(d => fetchJSON(API + d, {method: 'POST'})));
    await refreshAll();
  } catch (e) { showError('Demo load failed: ' + e.message); }
}

// ── Polling ─────────────────────────────────────────────

function startPolling(ms) {
  if (state.polling) clearInterval(state.polling);
  state.pollMs = ms;
  if (ms > 0) state.polling = setInterval(refreshAll, ms);
}

// ── Init ────────────────────────────────────────────────

$('#btn-refresh').onclick = refreshAll;
$('#btn-demo').onclick = loadDemoData;
$('#poll-interval').onchange = (e) => startPolling(parseInt(e.target.value));

refreshAll().then(() => startPolling(5000));

})();
</script>
