[project]
name = "ahy-governance"
version = "0.9.0"
description = "Multi-Agent Governance Platform — Conflict Detection, Cost Tracking, Audit Logging"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    {name = "Leo-Ayh-Oday"}
]
keywords = ["ai", "agent", "governance", "conflict-detection", "multi-agent", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/Leo-Ayh-Oday/ahy-governance"
Repository = "https://github.com/Leo-Ayh-Oday/ahy-governance"
Issues = "https://github.com/Leo-Ayh-Oday/ahy-governance/issues"

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ahy_governance*", "web*"]
exclude = [
    "ahy_governance.compliance_reporter*",
    "ahy_governance.policy_engine*",
    "ahy_governance.webhook_alerts*",
    "ahy_governance.interfaces*",
    "ahy_governance.migration*",
    "ahy_governance.scaffold*",
]

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.34", "httpx>=0.27"]
postgres = ["sqlalchemy>=2.0", "psycopg2-binary>=2.9"]
redis = ["redis>=5.0"]
observability = ["structlog>=24.0"]
security = ["bcrypt>=4.0", "PyJWT>=2.0"]
crewai = ["crewai>=0.30"]
prod = ["ahy-governance[postgres,redis,observability,web,security]"]

[project.scripts]
ahy-dashboard = "web.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501", "B008", "B904"]

[tool.ruff.lint.isort]
known-first-party = ["ahy_governance"]
