[project]
name = "ahy-governance"
version = "0.2.0"
description = "Multi-Agent Governance Platform — Conflict Detection, Cost Tracking, Audit Logging"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    {name = "Leo-Ayh-Oday"}
]
keywords = ["ai", "agent", "governance", "conflict-detection", "multi-agent", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/Leo-Ayh-Oday/ahy-governance"
Repository = "https://github.com/Leo-Ayh-Oday/ahy-governance"
Issues = "https://github.com/Leo-Ayh-Oday/ahy-governance/issues"

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
